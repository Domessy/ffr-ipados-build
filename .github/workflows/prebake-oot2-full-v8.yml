          ffr-cachyos oot2-write-checkpoint-v15 < "$RUNNER_TEMP/ZeldaOcarinaOfTime.ipa")"
        EXPECTED_BYTES=$(wc -c < "$RUNNER_TEMP/ZeldaOcarinaOfTime.ipa" | tr -d ' ')
