          LOCAL_ROUTE=oot2-local-bundle-v6-ready
          LOCAL_EXPECT=OOT2_LOCAL_BUNDLE_READY_V6
          if [ "${{ inputs.runtime_variant }}" = ipad-v15 ]; then
            LOCAL_ROUTE=oot2-local-bundle-v15-ready
            LOCAL_EXPECT=OOT2_LOCAL_BUNDLE_READY_V12
          elif [ "${{ inputs.runtime_variant }}" = ipad-v7 ]; then
            LOCAL_ROUTE=oot2-local-bundle-v7-ready
            LOCAL_EXPECT=OOT2_LOCAL_BUNDLE_READY_V7
          else
            [[ "${{ inputs.runtime_variant }}" = ipad-v6 ]] || exit 1
          fi
          read -r LOCAL_MARK LOCAL_BYTES <<< "$(ssh ffr-cachyos "$LOCAL_ROUTE")"
          [[ "$LOCAL_MARK" = "$LOCAL_EXPECT" && "$LOCAL_BYTES" =~ ^[1-9][0-9]*$ ]]
          echo 'OOT2 local final assembly inputs verified before transfers.'
        fi
