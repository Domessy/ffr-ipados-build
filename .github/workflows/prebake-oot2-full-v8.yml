        if [ "$free_kb" -lt 42000000 ]; then
          echo 'OOT2 runner disk below initial 42 GB admission guard.' >&2
          exit 1
        fi
    - name: Validate complete official v15 source before private transfers
      run: |
        set -euo pipefail
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install xcodegen zstd spirv-cross glslang python@3.15
        "$(brew --prefix python@3.15)/bin/python3.15" -m venv "$RUNNER_TEMP/oot2-venv"
        "$RUNNER_TEMP/oot2-venv/bin/python" -m pip install -q lz4 'capstone>=5,<6' fonttools nsz zbic PyYAML unicorn
        SRC="$RUNNER_TEMP/nxnative"
        git init -q "$SRC"
        git -C "$SRC" remote add origin https://github.com/seedds/nxnative.git
        git -C "$SRC" fetch -q --depth 1 origin f5c5a82305dd3b2ab4d0c85eb182df0c36862303
        git -C "$SRC" checkout -q --detach FETCH_HEAD
        python3 security/oot2_prepare_ipad_v15.py "$SRC"
        "$RUNNER_TEMP/oot2-venv/bin/python" security/oot2_v15_public.py "$SRC" "$RUNNER_TEMP/public-v15" > "$RUNNER_TEMP/public-v15.log" 2>&1 || { grep -nE '(^|[[:space:]])(fatal error:|error:|FAIL:|ERROR:|Undefined symbols|ld:|make: \*\*\*)' "$RUNNER_TEMP/public-v15.log" | tail -80 || true; tail -140 "$RUNNER_TEMP/public-v15.log"; exit 1; }
