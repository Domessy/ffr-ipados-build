      if: steps.compile.outputs.state == 'ready'
    - name: Synchroniser diagnostic prive sur succes ou echec
      if: always()
      run: |
        if [ -s "$RUNNER_TEMP/oot2-build.log" ]; then
          tail -c 33554432 "$RUNNER_TEMP/oot2-build.log" \
            | ssh -o ConnectTimeout=20 ffr-cachyos oot2-write-log-v15 || true
        fi
        if [ -s "$RUNNER_TEMP/v15-archives.log" ]; then
