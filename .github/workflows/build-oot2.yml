name: The Legend of Zelda Ocarina Switch 2 - experimental iPadOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect NUP 1.2.0 v131072 or build experimental IPA
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - build

      runtime_variant:
        description: iPad optimization candidate or preserved earlier experiments
        type: choice
        required: true
        default: ipad-v6
        options:
          - baseline
          - depth
          - memory-v1
          - graphics-v2
          - terrain-v3
          - upstream-v4
          - ipad-v5
          - ipad-v6

      ipa_layout:
        description: Bundle on Mac, separate device data, or assemble full IPA on CachyOS
        type: choice
        required: true
        default: local-bundle
        options:
          - bundle
          - separate
          - local-bundle

      cache_restore:
        description: Full cache for same-chain resume, or compiled Metal snapshot for a new chain
        type: choice
        required: true
        default: full
        options:
          - full
          - metal-snapshot
          - resume-v5
          - resume-v6
          - empty

permissions:
  contents: read

concurrency:
  group: oot2-switch2-build
  cancel-in-progress: false

jobs:
  build:
    # Explicitly enabled only by security/harden-cachyos.sh on the user's PC.
    if: vars.FFR_SECURITY_READY == 'true'
    # Apple Silicon standard, public repositories: GitHub Xcode 27 image.
    runs-on: xcode-27
    # GitHub-hosted jobs may run up to 360 min. Keep a margin for private log upload and cleanup.
    timeout-minutes: 345
    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer les scripts de cache du meme commit GitHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verifier les scripts et tests NUP avant tout transfert prive
        run: |
          set -euo pipefail
          python3 -m py_compile security/oot2_local_bundle.py security/oot2_prepare_ipad_v6.py security/oot2_ipad_v6_smoke.py security/ffr_ssh_gate.py security/oot2_nup_info.py security/oot2_gateway.py security/oot2_transfer.py security/oot2_sqlite_cas.py security/oot2_patch_nup_release.py security/oot2_prepare_ipad_v5.py security/oot2_ipad_v5_smoke.py security/run_oot2.py security/test_oot2_sqlite_cas.py security/test_oot2_patch_nup_release.py security/test_oot2_nup_info.py security/test_oot2_gateway.py security/test_oot2_transfer.py security/test_oot2_setup.py security/test_oot2_workflow.py security/test_oot2_memory_report.py security/test_oot2_ipa_layout.py security/test_oot2_cache_snapshot.py security/test_oot2_export_buildkit.py security/test_oot2_local_bundle.py
          bash -n security/setup_oot2.sh
          python3 -m unittest -v security/test_oot2_nup_info.py security/test_oot2_gateway.py security/test_oot2_transfer.py security/test_oot2_sqlite_cas.py security/test_oot2_patch_nup_release.py security/test_oot2_setup.py security/test_oot2_workflow.py security/test_oot2_memory_report.py security/test_oot2_ipa_layout.py security/test_oot2_cache_snapshot.py security/test_oot2_export_buildkit.py security/test_oot2_local_bundle.py

      - name: Verifier les secrets reseau avant toute installation couteuse
        env:
          TS_AUTHKEY: ${{ secrets.FFR_TS_AUTHKEY }}
          SSH_KEY: ${{ secrets.FFR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FFR_SSH_KNOWN_HOSTS }}
          TS_HOST: ${{ secrets.FFR_TS_HOST }}
          SSH_USER: ${{ secrets.FFR_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          # Never echo tokens or private SSH material. GitHub provides empty
          # strings for missing secrets, so fail before Xcode/Metal/Homebrew.
          for name in TS_AUTHKEY SSH_KEY SSH_KNOWN_HOSTS TS_HOST SSH_USER; do
            if [ -z "${!name}" ]; then
              echo "OOT2 preflight: missing required network secret: ${name}" >&2
              exit 1
            fi
          done
          echo 'OOT2 network secrets: declared and nonempty (values hidden).'

      - name: Selectionner Xcode 27.2 et verifier Metal, puis liberer de l'espace
        run: |
          set -euo pipefail
          echo 'Espace initial :'
          df -h "$RUNNER_TEMP"
          # The pinned nxnative commit requires Apple Metal 32023.922.
          # xcode-27 images may expose Xcode 27.2 as an alias to its RC app.
          CANDIDATE=''
          for app in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app /Applications/Xcode_27.2_Release_Candidate.app; do
            if [ -d "$app/Contents/Developer" ]; then
              CANDIDATE="$app"
              break
            fi
          done
          if [ -z "$CANDIDATE" ]; then
            echo 'Xcode 27.2 is unavailable on this GitHub runner image.' >&2
            exit 1
          fi
          # Resolve aliases before cleanup: never remove the actual selected Xcode.
          KEEP="$(cd "$CANDIDATE" && pwd -P)"
          echo "Xcode conserve : $KEEP"
          sudo xcode-select -s "$KEEP/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 27\.2(\.|$)'
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$KEEP" ] && continue
            echo "Suppression sur runner ephemere : $app"
            sudo rm -rf -- "$app"
          done
          # Metal is an optional Xcode component; fetch only if not installed.
          if ! xcodebuild -showComponent metalToolchain 2>/dev/null | grep -qi 'Status: installed'; then
            echo 'Installation du Metal Toolchain correspondant a Xcode 27.2.'
            xcodebuild -downloadComponent metalToolchain
          fi
          echo 'Compilateurs Metal selectionnes :'
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version
          for sdk in macosx iphoneos; do
            xcrun -sdk "$sdk" metal --version \
              | grep -Fq 'Apple metal version 32023.922 (metalfe-32023.922.4)' || {
                echo "Incorrect Metal compiler for $sdk; stopping before private transfers." >&2
                exit 1
              }
          done
          echo 'Metal 32023.922 verified for macOS and iPhoneOS SDKs.'

          # xcodebuild uses the iOS DEVICE SDK, not an Android SDK or
          # simulator runtime. All cleanup is confined to this ephemeral runner,
          # never to CachyOS or any developer workstation.
          echo 'Liberation espace temporaire pour OOT2.'
          if [ "$HOME" = "/Users/runner" ]; then
            for sdk in "$HOME/Library/Android/sdk" "$HOME/Library/Android/Sdk"; do
              if [ -d "$sdk" ] && [ ! -L "$sdk" ]; then
                du -sh "$sdk" || true
                sudo rm -rf -- "$sdk"
              fi
            done
          fi
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 95000000 ]; then
            echo 'OOT2: nettoyage des runtimes de simulateurs inutiles si l’espace est limite.'
            xcrun simctl runtime list || true
            # On Xcode 27 this supported simctl operation removes simulator
            # runtime disk images, not the iOS device SDK or Metal compiler.
            # Bound its runtime to avoid hanging a hosted job indefinitely.
            python3 - <<'PY'
          import subprocess
          try:
              p = subprocess.run(
                  ["xcrun", "simctl", "runtime", "delete", "all"],
                  capture_output=True, text=True, timeout=240, check=False)
              print(f"Simulator runtime cleanup exit code: {p.returncode}")
              if p.returncode:
                  print("Simulator runtime cleanup unavailable; continuing to disk preflight.")
          except (OSError, subprocess.TimeoutExpired):
              print("Simulator runtime cleanup timed out/unavailable; continuing to disk preflight.")
          PY
            xcrun simctl delete unavailable || true
          fi
          df -h "$RUNNER_TEMP"
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          # Sufficient space for derived Zelda Ocarina Switch 2 game data, extracted RomFS, shader CAS and IPA.
          if [ "$free_kb" -lt 42000000 ]; then
            echo 'OOT2 runner disk below initial 42 GB admission guard.' >&2
            exit 1
          fi

      - name: Installer les dependances nxnative
        env:
          OOT2_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Homebrew passe par ghcr.io : attendre si le DNS est temporairement indisponible.
          for attempt in 1 2 3 4; do
            echo "Installation Homebrew, tentative ${attempt}/4"
            if brew install xcodegen zstd spirv-cross glslang; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Installation Homebrew impossible apres 4 tentatives." >&2
              exit 1
            fi
            echo "Echec transitoire, nouvel essai dans 20 secondes."
            sleep 20
          done
          dotnet --version
          python3 -m venv "$RUNNER_TEMP/oot2-venv"
          "$RUNNER_TEMP/oot2-venv/bin/python" -m pip install -q lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"
          # Pin the upstream code that processes the NUP; no keys are transferred.
          NXNATIVE_SHA="c229bd7d52e30f072362e31c7b1e3206d107d4cd"
          if [ "$OOT2_RUNTIME_VARIANT" = upstream-v4 ]; then
            NXNATIVE_SHA="1794a35a1a2462a75cb1730eee29d32fac81248c"
          elif [ "$OOT2_RUNTIME_VARIANT" = ipad-v5 ]; then
            NXNATIVE_SHA="7f50222003e4270e3655d4f798e85744d390edf0"
          elif [ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]; then
            NXNATIVE_SHA="8d5d4f1b04610fef5a96521c72a4263d68794959"
          fi
          # Use a complete, immutable Git object ID (not a 39-digit prefix).
          [[ "$NXNATIVE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'OOT2: invalid pinned upstream commit ID (expected full 40-hex SHA).' >&2
            exit 1
          }
          git init -q "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/seedds/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch -q --depth 1 origin "$NXNATIVE_SHA"
          git -C "$RUNNER_TEMP/nxnative" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$NXNATIVE_SHA"
          # Verify the compiler before transferring any private game data.
          # reject Metal versions incompatible with the pinned nxnative shader chain.
          "$RUNNER_TEMP/oot2-venv/bin/python" "$RUNNER_TEMP/nxnative/dm/gfx/tools/own_compilers.py" --check-metal
          # The pinned NUP parser keeps its mmap open until process exit. Our
          # isolated OOT2 source has been fully extracted before iOS shaders.
          # Patch only this ephemeral checkout to close the mmap and unlink
          # the Mac-runner copy after extracting the RomFS; never touch the
          # local CachyOS NUP or any other game.
          if [ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]; then
            python3 security/oot2_prepare_ipad_v6.py "$RUNNER_TEMP/nxnative"
          elif [ "$OOT2_RUNTIME_VARIANT" = ipad-v5 ]; then
            python3 security/oot2_prepare_ipad_v5.py "$RUNNER_TEMP/nxnative"
          elif [ "$OOT2_RUNTIME_VARIANT" = upstream-v4 ]; then
            python3 security/oot2_prepare_upstream.py "$RUNNER_TEMP/nxnative"
          else
            python3 security/oot2_patch_nup_release.py "$RUNNER_TEMP/nxnative/scripts/build_ipa_from_nsp.py"
          fi
          if [ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]; then
            echo "iPad-v6: official reviewed revision, no experimental fork overlay."
          elif [ "$OOT2_RUNTIME_VARIANT" = ipad-v5 ]; then
            echo 'iPad-v5: reviewed optimization recipe applied; old pin backports excluded.'
          elif [ "$OOT2_RUNTIME_VARIANT" = upstream-v4 ]; then
            echo 'Official upstream-v4: old pin backports deliberately not applied.'
          elif [ "$OOT2_RUNTIME_VARIANT" = graphics-v2 ] || [ "$OOT2_RUNTIME_VARIANT" = terrain-v3 ]; then
            git -C "$RUNNER_TEMP/nxnative" fetch -q --depth 1 origin 167769131235226c739517a0a3e53fce48025b1f
            python3 security/oot2_patch_graphics.py "$RUNNER_TEMP/nxnative"
            python3 security/oot2_patch_runtime.py "$RUNNER_TEMP/nxnative" --variant memory-v1
            if [ "$OOT2_RUNTIME_VARIANT" = terrain-v3 ]; then
              python3 security/oot2_patch_terrain.py "$RUNNER_TEMP/nxnative"
            fi
          else
            python3 security/oot2_patch_runtime.py "$RUNNER_TEMP/nxnative" --variant "$OOT2_RUNTIME_VARIANT"
          fi
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 38000000 ]; then
            echo "Espace restant insuffisant apres installation ($free_kb Ko, objectif 38000000 Ko)." >&2
            exit 1
          fi

      - name: Installer Tailscale en ligne de commande (sans action DNS)
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for attempt in 1 2 3; do
            if brew install --formula tailscale; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          command -v tailscale
          command -v tailscaled

      - name: Connecter Tailscale sans modifier les DNS macOS
        env:
          TS_AUTHKEY: ${{ secrets.FFR_TS_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TS_AUTHKEY"
          TS_CLI="$(command -v tailscale)"
          TS_DAEMON="$(command -v tailscaled)"
          TS_SOCKET="$RUNNER_TEMP/oot2-tailscaled.sock"
          # Temporary daemon with in-memory state; no persistent login data.
          nohup sudo -n "$TS_DAEMON" --state=mem: --socket="$TS_SOCKET" \
            > "$RUNNER_TEMP/oot2-tailscaled.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/oot2-tailscaled.pid"
          daemon_ready=0
          for attempt in $(seq 1 30); do
            if sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json > /dev/null 2>&1; then
              daemon_ready=1
              break
            fi
            sleep 1
          done
          if [ "$daemon_ready" -ne 1 ]; then
            echo 'Tailscale daemon did not become ready.' >&2
            exit 1
          fi
          # No MagicDNS required: the host is reached by its Tailscale IPv4 address.
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" up \
            --authkey="$TS_AUTHKEY" \
            --accept-dns=false \
            --timeout=120s \
            --hostname="oot2-ci-${GITHUB_RUN_ID}"
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("BackendState") == "Running"; print("Tailscale running; macOS system DNS unchanged.")'

      - name: Configurer SSH avec cle d'hote epinglee
        env:
          SSH_KEY: ${{ secrets.FFR_SSH_KEY }}
          HOSTKEY: ${{ secrets.FFR_SSH_KNOWN_HOSTS }}
          PC_IP: ${{ secrets.FFR_TS_HOST }}
          PC_USER: ${{ secrets.FFR_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/oot2_ssh_key"
          printf '%s\n' "$HOSTKEY" > "$RUNNER_TEMP/oot2_known_hosts"
          chmod 600 "$RUNNER_TEMP/oot2_ssh_key" "$RUNNER_TEMP/oot2_known_hosts"
          {
            echo 'Host ffr-cachyos'
            printf '  HostName %s\n' "$PC_IP"
            printf '  User %s\n' "$PC_USER"
            echo '  Port 22'
            printf '  IdentityFile %s\n' "$RUNNER_TEMP/oot2_ssh_key"
            printf '  UserKnownHostsFile %s\n' "$RUNNER_TEMP/oot2_known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          [ "$(ssh -o ConnectTimeout=15 ffr-cachyos oot2-probe-v1)" = 'OOT2_GATEWAY_V1' ]
          ssh -o ConnectTimeout=15 ffr-cachyos oot2-diagnose-v1

      - name: Verifier le NUP et la capacite disque avant transfert
        run: |
          set -euo pipefail
          read -r TITLE VERSION NUP_BYTES BASE PATCHES PKGS <<< "$(ssh -o ConnectTimeout=20 ffr-cachyos oot2-manifest-v1)"
          [[ "$TITLE" == "0400486024DEC000" && "$VERSION" == "v131072" && "$BASE" =~ ^[01]$ && "$PATCHES" == 1 ]]
          [[ "$NUP_BYTES" =~ ^[1-9][0-9]*$ && "$PKGS" =~ ^[1-9][0-9]*$ ]]
          free=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          # The NUP is retained while its files are unpacked. Measure the
          # selected RomFS from the verified TOC, rather than assuming an
          # arbitrary second NUP copy plus 32 GiB.
          read -r MARK SOURCE_BYTES ROMFS_BYTES <<< "$(ssh -o ConnectTimeout=25 ffr-cachyos oot2-space-v1)"
          [[ "$MARK" == OOT2_SPACE_V1 && "$SOURCE_BYTES" == "$NUP_BYTES" && "$ROMFS_BYTES" =~ ^[1-9][0-9]*$ ]]
          required=$(( NUP_BYTES + ROMFS_BYTES + 12 * 1024**3 ))
          echo "OOT2: source_bytes=$NUP_BYTES; romfs_bytes=$ROMFS_BYTES; packages=$PKGS; free_bytes=$free; required_bytes=$required"
          if (( free < required )); then
            echo 'OOT2: insufficient temporary disk; NUP not transferred.' >&2
            exit 1
          fi
          echo 'OOT2 remote metadata and runner disk preflight passed.'
          read -r RELEASE_MARK RELEASE_ID <<< "$(ssh -o ConnectTimeout=25 ffr-cachyos oot2-release-preflight-v1)"
          [[ "$RELEASE_MARK" == OOT2_RELEASE_READY_V1 && "$RELEASE_ID" =~ ^[1-9][0-9]*:[0-9a-f]{64}$ ]]
          echo "OOT2_NUP_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo 'OOT2 runner-copy release eligibility checked before cache and NUP transfer.'
          if [ "${{ inputs.ipa_layout }}" = local-bundle ]; then
            [[ "${{ inputs.runtime_variant }}" = ipad-v6 ]] || exit 1
            read -r LOCAL_MARK LOCAL_BYTES <<< "$(ssh ffr-cachyos oot2-local-bundle-v6-ready)"
            [[ "$LOCAL_MARK" = OOT2_LOCAL_BUNDLE_READY_V6 && "$LOCAL_BYTES" =~ ^[1-9][0-9]*$ ]]
            echo 'OOT2 local final assembly inputs verified before transfers.'
          fi

      - name: Restaurer le cache de shaders OOT2
        if: ${{ inputs.mode == 'build' }}
        env:
          OOT2_CACHE_RESTORE: ${{ inputs.cache_restore }}
          OOT2_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          # nxnative Store opens DMSH_CAS with sqlite3.connect(): FILE path.
          # The restricted SSH gateway still transports only allowlisted flat
          # cache entries; import them into the SQLite file before NUP transfer.
          export DMSH_CAS="$RUNNER_TEMP/oot2-shader-cas/cas.db"
          umask 077
          mkdir -p "$(dirname "$DMSH_CAS")"
          if [ "$OOT2_CACHE_RESTORE" = metal-snapshot ] || [ "$OOT2_CACHE_RESTORE" = resume-v5 ] || [ "$OOT2_CACHE_RESTORE" = resume-v6 ]; then
            SNAPSHOT_ROUTE=oot2-metal-snapshot-info-v1
            SNAPSHOT_ROLE=metal-snapshot
            ACCEPT_ARGS=()
            if [ "$OOT2_CACHE_RESTORE" = resume-v5 ]; then
              [[ "$OOT2_RUNTIME_VARIANT" = ipad-v5 ]] || { echo "Resume cache is specific to ipad-v5." >&2; exit 1; }
              SNAPSHOT_ROUTE=oot2-resume-v5-info
              SNAPSHOT_ROLE=resume-v5
              ACCEPT_ARGS=(--translations)
            elif [ "$OOT2_CACHE_RESTORE" = resume-v6 ]; then
              [[ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]] || { echo "Resume cache is specific to ipad-v6." >&2; exit 1; }
              SNAPSHOT_ROUTE=oot2-resume-v6-info
              SNAPSHOT_ROLE=resume-v6
              ACCEPT_ARGS=(--translations)
            fi
            # Direct SQLite avoids the flat tar extraction/import round trip.
            # Compile keys include MSL, flags and compiler; no chain relabel.
            echo 'OOT2 cache: preparing snapshot metadata on CachyOS.'
            read -r MARK COMPRESSED_BYTES SQLITE_BYTES SNAPSHOT_ENTRIES <<< "$(ssh -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos "$SNAPSHOT_ROUTE")"
            [[ "$MARK" == OOT2_METAL_SNAPSHOT_V1 && "$COMPRESSED_BYTES" =~ ^[1-9][0-9]*$ && "$SQLITE_BYTES" =~ ^[1-9][0-9]*$ && "$SNAPSHOT_ENTRIES" =~ ^[1-9][0-9]*$ ]]
            free=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
            # The compressed file temporarily coexists with its database.
            (( free >= COMPRESSED_BYTES + SQLITE_BYTES + 7 * 1024**3 )) || { echo 'OOT2: insufficient cache restoration disk.' >&2; exit 1; }
            python3 security/oot2_transfer.py "$SNAPSHOT_ROLE" "$COMPRESSED_BYTES" "$(dirname "$DMSH_CAS")/metal-snapshot.zst"
            echo 'OOT2 cache transfer complete (100%); decompressing SQLite snapshot.'
            zstd -q -d -c "$(dirname "$DMSH_CAS")/metal-snapshot.zst" > "$DMSH_CAS.partial"
            rm "$(dirname "$DMSH_CAS")/metal-snapshot.zst"
            echo 'OOT2 cache decompressed; validating database and compiled blobs.'
            python3 security/oot2_cache_snapshot.py accept "$(dirname "$DMSH_CAS")" "${ACCEPT_ARGS[@]}"
          elif [ "$OOT2_CACHE_RESTORE" = empty ]; then
            echo "OOT2: new compile flags; initialize empty CAS without transferring incompatible libraries."
            python3 security/oot2_sqlite_cas.py prepare "$(dirname "$DMSH_CAS")"
          elif [ "$OOT2_CACHE_RESTORE" = full ]; then
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos oot2-read-cache | tar -xz -C "$(dirname "$DMSH_CAS")"
            python3 security/oot2_sqlite_cas.py prepare "$(dirname "$DMSH_CAS")"
          else
            echo 'OOT2: invalid cache restore mode.' >&2
            exit 1
          fi
          # Exercise the actual pinned nxnative schema BEFORE transferring 25GB.
          "$RUNNER_TEMP/oot2-venv/bin/python" "$RUNNER_TEMP/nxnative/dm/tools/shader_cache.py" "$DMSH_CAS"
          read -r TITLE VERSION NUP_BYTES BASE PATCHES PKGS <<< "$(ssh ffr-cachyos oot2-manifest-v1)"
          free=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          read -r MARK SOURCE_BYTES ROMFS_BYTES <<< "$(ssh -o ConnectTimeout=25 ffr-cachyos oot2-space-v1)"
          [[ "$MARK" == OOT2_SPACE_V1 && "$SOURCE_BYTES" == "$NUP_BYTES" && "$ROMFS_BYTES" =~ ^[1-9][0-9]*$ ]]
          # Same source + unpacked RomFS + reserve, now counting restored CAS.
          required=$(( NUP_BYTES + ROMFS_BYTES + 12 * 1024**3 ))
          if (( free < required )); then
            echo 'OOT2: cache consumed disk reserve; NUP not transferred.' >&2
            exit 1
          fi
          python3 - "$DMSH_CAS" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              count = db.execute("SELECT count(*) FROM entry").fetchone()[0]
              integrity = db.execute("PRAGMA quick_check").fetchone()[0]
          assert integrity == "ok"
          print(f"OOT2 SQLite shader CAS ready: entries={count}")
          PY

      - name: Transferer uniquement le NUP, sans cles
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/oot2-nup"
          read -r TITLE VERSION NUP_BYTES BASE PATCHES PKGS <<< "$(ssh ffr-cachyos oot2-manifest-v1)"
          [[ "$TITLE" == 0400486024DEC000 && "$VERSION" == v131072 && "$BASE" =~ ^[01]$ && "$PATCHES" == 1 ]]
          python3 security/oot2_transfer.py nup "$NUP_BYTES" "$RUNNER_TEMP/oot2-nup/OcarinaOfTime.nup"
          python3 security/oot2_nup_info.py "$RUNNER_TEMP/oot2-nup/OcarinaOfTime.nup"
          echo 'OOT2 transfer complete; originals and keys stay on CachyOS.'

      - name: Compiler IPA experimentale Ocarina Switch 2
        if: ${{ inputs.mode == 'build' }}
        env:
          OOT2_IPA_LAYOUT: ${{ inputs.ipa_layout }}
          OOT2_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          python3 security/run_oot2.py

      - name: Conserver les entrees privees pour une future reconstruction du moteur
        if: ${{ inputs.mode == 'build' && (inputs.runtime_variant == 'upstream-v4' || inputs.runtime_variant == 'ipad-v5' || inputs.runtime_variant == 'ipad-v6') }}
        continue-on-error: true
        env:
          OOT2_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          KIT_VERSION=v4
          KIT_ROUTE=oot2-write-host-kit-v1
          if [ "$OOT2_RUNTIME_VARIANT" = ipad-v5 ]; then KIT_VERSION=v5; KIT_ROUTE=oot2-write-host-kit-v5; fi
          if [ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]; then KIT_VERSION=v6; KIT_ROUTE=oot2-write-host-kit-v6; fi
          python3 security/oot2_export_buildkit.py "$RUNNER_TEMP" "$RUNNER_TEMP/OOT2HostKit-$KIT_VERSION.tar.zst"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            ffr-cachyos "$KIT_ROUTE" < "$RUNNER_TEMP/OOT2HostKit-$KIT_VERSION.tar.zst"
          echo 'Private rebuild inputs saved; host-only rebuild still requires validation.'

      - name: Rapatrier IPA OOT2 sans lancement sur iPad
        env:
          OOT2_IPA_LAYOUT: ${{ inputs.ipa_layout }}
          OOT2_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ZeldaOcarinaOfTime.ipa"
          IPA_ROUTE=oot2-write-ipa
          if [ "$OOT2_IPA_LAYOUT" = local-bundle ]; then
            [[ "$OOT2_RUNTIME_VARIANT" = ipad-v6 ]] || exit 1
            IPA_ROUTE=oot2-write-slim-v6
          fi
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            ffr-cachyos "$IPA_ROUTE" < "$RUNNER_TEMP/ZeldaOcarinaOfTime.ipa"
          echo 'OOT2 IPA returned privately; memory safety unverified.'

      - name: Synchroniser diagnostic prive sur succes ou echec
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/oot2-build.log" ]; then
            tail -c 33554432 "$RUNNER_TEMP/oot2-build.log" \
              | ssh -o ConnectTimeout=20 ffr-cachyos oot2-write-log || true
          fi
          rm -f "$RUNNER_TEMP/oot2-nup/OcarinaOfTime.nup" "$RUNNER_TEMP/oot2_ssh_key" || true

      - name: Fermer la connexion Tailscale ephemere
        if: always()
        run: |
          TS_SOCKET="$RUNNER_TEMP/oot2-tailscaled.sock"
          if command -v tailscale >/dev/null 2>&1; then
            sudo -n tailscale --socket="$TS_SOCKET" logout > /dev/null 2>&1 || true
          fi
          if [ -s "$RUNNER_TEMP/oot2-tailscaled.pid" ]; then
            sudo -n kill "$(cat "$RUNNER_TEMP/oot2-tailscaled.pid")" > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/oot2_ssh_key" || true
