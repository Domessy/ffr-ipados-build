name: FFR - IPA iPadOS (nxnative)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffr-build
  cancel-in-progress: false

jobs:
  build:
    # Explicitly enabled only by security/harden-cachyos.sh on the user's PC.
    if: vars.FFR_SECURITY_READY == 'true'
    # macOS Apple Silicon standard: gratuit dans un depot public GitHub.
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - name: Liberer de l'espace sur le Mac ephemere en conservant Xcode 26
        run: |
          set -euo pipefail
          echo 'Espace initial :'
          df -h "$RUNNER_TEMP"
          # macos-15 contient plusieurs Xcode : garder le 26.x le plus recent.
          KEEP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          if [ -z "$KEEP" ]; then
            echo 'Aucun Xcode 26 disponible sur ce runner.' >&2
            exit 1
          fi
          echo "Xcode conserve : $KEEP"
          sudo xcode-select -s "$KEEP/Contents/Developer"
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            [ "$app" = "$KEEP" ] && continue
            [ -L "$app" ] && continue
            echo "Suppression sur runner ephemere : $app"
            sudo rm -rf -- "$app"
          done
          xcodebuild -version
          df -h "$RUNNER_TEMP"
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 30000000 ]; then
            echo "Espace insuffisant pour ce jeu ($free_kb Ko libres, objectif 30000000 Ko)." >&2
            echo 'Aucune donnee du jeu ne sera transferee.' >&2
            exit 1
          fi

      - name: Installer les dependances nxnative
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Homebrew passe par ghcr.io : attendre si le DNS est temporairement indisponible.
          for attempt in 1 2 3 4; do
            echo "Installation Homebrew, tentative ${attempt}/4"
            if brew install xcodegen zstd spirv-cross glslang; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Installation Homebrew impossible apres 4 tentatives." >&2
              exit 1
            fi
            echo "Echec transitoire, nouvel essai dans 20 secondes."
            sleep 20
          done
          dotnet --version
          python3 -m venv "$RUNNER_TEMP/ffr-venv"
          "$RUNNER_TEMP/ffr-venv/bin/python" -m pip install -q lz4 capstone fonttools
          # Pin the upstream code that will process local Nintendo key material.
          NXNATIVE_SHA="78cb26d91373d6731984a9692607b796a6b23162"
          git init -q "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/seedds/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch -q --depth 1 origin "$NXNATIVE_SHA"
          git -C "$RUNNER_TEMP/nxnative" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$NXNATIVE_SHA"

      - name: Connecter le runner au PC CachyOS via Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          authkey: ${{ secrets.FFR_TS_AUTHKEY }}
          # SSH probe below performs the sole required connectivity check.
          use-cache: 'false'
          # Ne pas remplacer les DNS du runner macOS.
          args: --accept-dns=false

      - name: Configurer SSH avec cle d'hote epinglee
        env:
          SSH_KEY: ${{ secrets.FFR_SSH_KEY }}
          HOSTKEY: ${{ secrets.FFR_SSH_KNOWN_HOSTS }}
          PC_IP: ${{ secrets.FFR_TS_HOST }}
          PC_USER: ${{ secrets.FFR_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ffr_ssh_key"
          printf '%s\n' "$HOSTKEY" > "$RUNNER_TEMP/ffr_known_hosts"
          chmod 600 "$RUNNER_TEMP/ffr_ssh_key" "$RUNNER_TEMP/ffr_known_hosts"
          {
            echo 'Host ffr-cachyos'
            printf '  HostName %s\n' "$PC_IP"
            printf '  User %s\n' "$PC_USER"
            echo '  Port 22'
            printf '  IdentityFile %s\n' "$RUNNER_TEMP/ffr_ssh_key"
            printf '  UserKnownHostsFile %s\n' "$RUNNER_TEMP/ffr_known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          [ "$(ssh -o ConnectTimeout=15 ffr-cachyos probe)" = 'FFR_GATEWAY_OK' ]

      - name: Copier les 2 NSP et les cles depuis CachyOS (hors de GitHub)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ffr-nsp"
          # The forced-command SSH key cannot execute a shell or browse files.
          ssh ffr-cachyos read-base > "$RUNNER_TEMP/ffr-nsp/v-final_fantasy_resonance.nsp"
          ssh ffr-cachyos read-update > "$RUNNER_TEMP/ffr-nsp/v-final_fantasy_resonance_v65536.nsp"
          ssh ffr-cachyos read-keys > "$RUNNER_TEMP/ffr-prod.keys"
          test -s "$RUNNER_TEMP/ffr-prod.keys"
          df -h "$RUNNER_TEMP"

      - name: Compiler l'IPA Final Fantasy Resonance 1.0.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nxnative"
          # Never stream nxnative output (or accidental key material) to PUBLIC Actions logs.
          if ! "$RUNNER_TEMP/ffr-venv/bin/python" scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/ffr-nsp" \
            -k "$RUNNER_TEMP/ffr-prod.keys" \
            -o "$RUNNER_TEMP/FFR-iPadOS.ipa" \
            --no-keep-extracted \
            --show-fps > "$RUNNER_TEMP/ffr-build.log" 2>&1; then
            echo "nxnative returned a non-zero status; see private ffr-build.log on CachyOS."
            exit 1
          fi
          test -s "$RUNNER_TEMP/FFR-iPadOS.ipa"

      - name: Renvoyer l'IPA directement sur CachyOS
        run: |
          set -euo pipefail
          ssh ffr-cachyos write-ipa < "$RUNNER_TEMP/FFR-iPadOS.ipa"
          shasum -a 256 "$RUNNER_TEMP/FFR-iPadOS.ipa"
          echo 'IPA transferee sur CachyOS.'

      - name: Renvoyer le journal de compilation
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/ffr-build.log" ]; then
            ssh ffr-cachyos write-log < "$RUNNER_TEMP/ffr-build.log" || true
          fi
          rm -f "$RUNNER_TEMP/ffr-prod.keys" "$RUNNER_TEMP/ffr_ssh_key" || true
