name: Zelda BOTW - capacity preflight and IPA (nxnative)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capacity check first, then build using identical private sources
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - build

permissions:
  contents: read

concurrency:
  group: botw-build
  cancel-in-progress: false

jobs:
  build:
    # Explicitly enabled only by security/harden-cachyos.sh on the user's PC.
    if: vars.FFR_SECURITY_READY == 'true'
    # Apple Silicon standard, public repositories: GitHub Xcode 27 image.
    runs-on: xcode-27
    # GitHub-hosted jobs may run up to 360 min. Keep a margin for private log upload and cleanup.
    timeout-minutes: 345
    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer les scripts de cache du meme commit GitHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verifier les scripts avant tout transfert prive
        run: |
          set -euo pipefail
          python3 -m py_compile security/ffr_ssh_gate.py security/botw_gateway.py security/cache_export.py security/run_botw.py security/test_cache_import.py security/test_botw_gateway.py
          python3 -m unittest -v security/test_cache_import.py security/test_botw_gateway.py

      - name: Preparer Xcode 27.1 et liberer de l'espace
        run: |
          set -euo pipefail
          echo 'Espace initial :'
          df -h "$RUNNER_TEMP"
          # nxnative/dmsh_chain.lock requires the Xcode 27.1 Metal compiler.
          KEEP=/Applications/Xcode_27.1.app
          if [ ! -d "$KEEP/Contents/Developer" ]; then
            echo 'Xcode 27.1 indisponible sur cette image GitHub.' >&2
            exit 1
          fi
          echo "Xcode conserve : $KEEP"
          sudo xcode-select -s "$KEEP/Contents/Developer"
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            [ "$app" = "$KEEP" ] && continue
            [ -L "$app" ] && continue
            echo "Suppression sur runner ephemere : $app"
            sudo rm -rf -- "$app"
          done
          xcodebuild -version
          # Since Xcode 26, the Metal toolchain is an optional component.
          if ! xcodebuild -showComponent metalToolchain 2>/dev/null | grep -qi 'Status: installed'; then
            echo 'Installation du Metal Toolchain correspondant a Xcode 27.1.'
            xcodebuild -downloadComponent metalToolchain
          fi
          echo 'Compilateurs Metal selectionnes :'
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version

          # xcodebuild uses the iOS DEVICE SDK, not an Android SDK or
          # simulator runtime. All cleanup is confined to this ephemeral runner,
          # never to CachyOS or any developer workstation.
          echo 'Liberation espace temporaire pour BOTW.'
          if [ "$HOME" = "/Users/runner" ]; then
            for sdk in "$HOME/Library/Android/sdk" "$HOME/Library/Android/Sdk"; do
              if [ -d "$sdk" ] && [ ! -L "$sdk" ]; then
                du -sh "$sdk" || true
                sudo rm -rf -- "$sdk"
              fi
            done
          fi
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 55000000 ]; then
            echo 'Espace encore limite: nettoyage des runtimes de simulateurs GitHub inutilises.'
            xcrun simctl runtime list || true
            # On Xcode 27 this supported simctl operation removes simulator
            # runtime disk images, not the iOS device SDK or Metal compiler.
            # Bound its runtime to avoid hanging a hosted job indefinitely.
            python3 - <<'PY'
          import subprocess
          try:
              p = subprocess.run(
                  ["xcrun", "simctl", "runtime", "delete", "all"],
                  capture_output=True, text=True, timeout=240, check=False)
              print(f"Simulator runtime cleanup exit code: {p.returncode}")
              if p.returncode:
                  print("Simulator runtime cleanup unavailable; continuing to disk preflight.")
          except (OSError, subprocess.TimeoutExpired):
              print("Simulator runtime cleanup timed out/unavailable; continuing to disk preflight.")
          PY
            xcrun simctl delete unavailable || true
          fi
          df -h "$RUNNER_TEMP"
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          # BOTW cache is independent from all other titles.
          # Reserve capacity for shaders, NSPs and
          # assemble an IPA. Abort BEFORE any private transfer if too tight.
          if [ "$free_kb" -lt 55000000 ]; then
            echo "Espace insuffisant avant restauration du cache BOTW ($free_kb Ko, objectif 55000000 Ko)." >&2
            echo 'Aucune donnee du jeu ne sera transferee.' >&2
            exit 1
          fi

      - name: Installer les dependances nxnative
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Homebrew passe par ghcr.io : attendre si le DNS est temporairement indisponible.
          for attempt in 1 2 3 4; do
            echo "Installation Homebrew, tentative ${attempt}/4"
            if brew install xcodegen zstd spirv-cross glslang; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Installation Homebrew impossible apres 4 tentatives." >&2
              exit 1
            fi
            echo "Echec transitoire, nouvel essai dans 20 secondes."
            sleep 20
          done
          dotnet --version
          python3 -m venv "$RUNNER_TEMP/botw-venv"
          "$RUNNER_TEMP/botw-venv/bin/python" -m pip install -q lz4 capstone fonttools
          # Pin the upstream code that will process local Nintendo key material.
          NXNATIVE_SHA="78cb26d91373d6731984a9692607b796a6b23162"
          git init -q "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/seedds/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch -q --depth 1 origin "$NXNATIVE_SHA"
          git -C "$RUNNER_TEMP/nxnative" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$NXNATIVE_SHA"
          # Verify the compiler before transferring any private game data.
          # reject Metal versions incompatible with the pinned nxnative shader chain.
          "$RUNNER_TEMP/botw-venv/bin/python" "$RUNNER_TEMP/nxnative/dm/gfx/tools/own_compilers.py" --check-metal
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 52000000 ]; then
            echo "Espace restant insuffisant apres installation ($free_kb Ko, objectif 52000000 Ko)." >&2
            exit 1
          fi

      - name: Installer Tailscale en ligne de commande (sans action DNS)
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for attempt in 1 2 3; do
            if brew install --formula tailscale; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          command -v tailscale
          command -v tailscaled

      - name: Connecter Tailscale sans modifier les DNS macOS
        env:
          TS_AUTHKEY: ${{ secrets.FFR_TS_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TS_AUTHKEY"
          TS_CLI="$(command -v tailscale)"
          TS_DAEMON="$(command -v tailscaled)"
          TS_SOCKET="$RUNNER_TEMP/botw-tailscaled.sock"
          # Temporary daemon with in-memory state; no persistent login data.
          nohup sudo -n "$TS_DAEMON" --state=mem: --socket="$TS_SOCKET" \
            > "$RUNNER_TEMP/botw-tailscaled.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/botw-tailscaled.pid"
          daemon_ready=0
          for attempt in $(seq 1 30); do
            if sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json > /dev/null 2>&1; then
              daemon_ready=1
              break
            fi
            sleep 1
          done
          if [ "$daemon_ready" -ne 1 ]; then
            echo 'Tailscale daemon did not become ready.' >&2
            exit 1
          fi
          # No MagicDNS required: the host is reached by its Tailscale IPv4 address.
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" up \
            --authkey="$TS_AUTHKEY" \
            --accept-dns=false \
            --timeout=120s \
            --hostname="botw-ci-${GITHUB_RUN_ID}"
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("BackendState") == "Running"; print("Tailscale running; macOS system DNS unchanged.")'

      - name: Configurer SSH avec cle d'hote epinglee
        env:
          SSH_KEY: ${{ secrets.FFR_SSH_KEY }}
          HOSTKEY: ${{ secrets.FFR_SSH_KNOWN_HOSTS }}
          PC_IP: ${{ secrets.FFR_TS_HOST }}
          PC_USER: ${{ secrets.FFR_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/botw_ssh_key"
          printf '%s\n' "$HOSTKEY" > "$RUNNER_TEMP/botw_known_hosts"
          chmod 600 "$RUNNER_TEMP/botw_ssh_key" "$RUNNER_TEMP/botw_known_hosts"
          {
            echo 'Host ffr-cachyos'
            printf '  HostName %s\n' "$PC_IP"
            printf '  User %s\n' "$PC_USER"
            echo '  Port 22'
            printf '  IdentityFile %s\n' "$RUNNER_TEMP/botw_ssh_key"
            printf '  UserKnownHostsFile %s\n' "$RUNNER_TEMP/botw_known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          # Require the local path-scoped BOTW gateway, before any private data.
          [ "$(ssh -o ConnectTimeout=15 ffr-cachyos botw-probe-v1)" = 'SILKSONG_GATEWAY_V1' ]

      - name: Verifier les 4 NSP et le budget disque sans transfert
        run: |
          set -euo pipefail
          read -r GAME VERSION DLC_VERSION B U D1 D2 <<< "$(ssh ffr-cachyos botw-manifest-v1)"
          [[ "$GAME" == "01007EF00011E000" && "$VERSION" == "1114112" && "$DLC_VERSION" == "196608" ]]
          for size in "$B" "$U" "$D1" "$D2"; do
            [[ "$size" =~ ^[1-9][0-9]*$ ]]
          done
          total=$((B + U + D1 + D2))
          free_bytes=$(($(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}') * 1024))
          # Temporary NSPs plus extraction/shader work are live together.
          # This is an admission threshold, not a guarantee of final build size.
          required=$((2 * total + 14 * 1024**3))
          if [ "$required" -lt 52000000000 ]; then required=52000000000; fi
          echo "BOTW source packages=4; total_bytes=$total; available_bytes=$free_bytes; admission_bytes=$required"
          if [ "$free_bytes" -lt "$required" ]; then
            echo 'Not enough temporary runner disk for this BOTW build. No NSP transferred.' >&2
            exit 1
          fi
          echo 'BOTW package identity, version assumptions and disk capacity verified.'

      - name: Restaurer le cache de shaders depuis CachyOS
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          export DMSH_CAS="$RUNNER_TEMP/botw-shader-cas"
          umask 077
          mkdir -p "$DMSH_CAS"
          # Cached shader results are streamed exclusively over restricted SSH;
          # no Github artifacts or keys are used to store them.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos botw-read-cache \
            | tar -xz -C "$DMSH_CAS"
          echo "Existing shader cache restored (if any)."
          echo "BOTW CAS file count: $(find "$DMSH_CAS" -type f | wc -l | tr -d ' ')"
          du -sh "$DMSH_CAS"
          df -h "$RUNNER_TEMP"
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          read -r GAME VERSION DLC_VERSION B U D1 D2 <<< "$(ssh ffr-cachyos botw-manifest-v1)"
          total=$((B + U + D1 + D2))
          available=$(($(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}') * 1024))
          reserve=$((total + 20 * 1024**3))
          if [ "$available" -lt "$reserve" ]; then
            echo "Not enough free disk after restoring BOTW CAS: $available bytes (required $reserve). No NSP transferred." >&2
            exit 1
          fi

      - name: Transmettre quatre NSP BOTW dont deux DLC sans publication
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/botw-nsp"
          read -r GAME VERSION DLC_VERSION B U D1 D2 <<< "$(ssh ffr-cachyos botw-manifest-v1)"
          [[ "$GAME" == "01007EF00011E000" && "$VERSION" == "1114112" && "$DLC_VERSION" == "196608" ]]
          BASE="$RUNNER_TEMP/botw-nsp/BOTW [$GAME][v0].nsp"
          UPDATE="$RUNNER_TEMP/botw-nsp/BOTW [01007EF00011E800][v$VERSION].nsp"
          DLC1="$RUNNER_TEMP/botw-nsp/BOTW [01007EF00011F001][v$DLC_VERSION].nsp"
          DLC2="$RUNNER_TEMP/botw-nsp/BOTW [01007EF00011F002][v$DLC_VERSION].nsp"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos botw-read-base > "$BASE"
          test "$(stat -f %z "$BASE")" -eq "$B"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos botw-read-update > "$UPDATE"
          test "$(stat -f %z "$UPDATE")" -eq "$U"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos botw-read-dlc1 > "$DLC1"
          test "$(stat -f %z "$DLC1")" -eq "$D1"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos botw-read-dlc2 > "$DLC2"
          test "$(stat -f %z "$DLC2")" -eq "$D2"
          ssh ffr-cachyos botw-read-keys > "$RUNNER_TEMP/botw-prod.keys"
          test -s "$RUNNER_TEMP/botw-prod.keys"
          echo 'Four BOTW NSP copies verified by byte count; keys remain private.'
          df -h "$RUNNER_TEMP"

      - name: Compiler l'IPA et sauvegarder les shaders au fil de l'eau
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          python3 security/run_botw.py

      - name: Renvoyer l'IPA BOTW directement sur CachyOS
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          ssh ffr-cachyos botw-write-ipa < "$RUNNER_TEMP/ZeldaBreathOfTheWild-iPadOS.ipa"
          shasum -a 256 "$RUNNER_TEMP/ZeldaBreathOfTheWild-iPadOS.ipa"
          echo 'BOTW IPA transferee sur CachyOS.'

      - name: Renvoyer le journal de compilation
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/botw-build.log" ]; then
            # Cap diagnostics to the gateway's 32 MiB limit even after a long shader compile.
            tail -c 16777216 "$RUNNER_TEMP/botw-build.log" | ssh -o ConnectTimeout=20 ffr-cachyos botw-write-log || true
          fi
          rm -f "$RUNNER_TEMP/botw-prod.keys" "$RUNNER_TEMP/botw_ssh_key" || true

      - name: Fermer la connexion Tailscale ephemere
        if: always()
        run: |
          TS_SOCKET="$RUNNER_TEMP/botw-tailscaled.sock"
          if command -v tailscale >/dev/null 2>&1; then
            sudo -n tailscale --socket="$TS_SOCKET" logout > /dev/null 2>&1 || true
          fi
          if [ -s "$RUNNER_TEMP/botw-tailscaled.pid" ]; then
            sudo -n kill "$(cat "$RUNNER_TEMP/botw-tailscaled.pid")" > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/botw-prod.keys" "$RUNNER_TEMP/botw_ssh_key" || true
