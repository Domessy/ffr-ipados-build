name: Zelda Ocarina Switch 2 - synthetic NUP and network tests

on:
  push:
    branches:
      - feature/oot2-nup-native
    paths:
      - '.github/workflows/build-oot2.yml'
      - '.github/workflows/test-oot2.yml'
      - 'security/oot2_*.py'
      - 'security/oot2_*.patch'
      - 'security/test_oot2_*.py'
      - 'security/run_oot2.py'
      - 'security/setup_oot2.sh'
      - 'security/ffr_ssh_gate.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-oot2.yml'
      - '.github/workflows/test-oot2.yml'
      - 'security/oot2_*.py'
      - 'security/oot2_*.patch'
      - 'security/test_oot2_*.py'
      - 'security/run_oot2.py'
      - 'security/setup_oot2.sh'
      - 'security/ffr_ssh_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oot2-nup-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact changeset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python, Bash and NUP fixtures (no retail material)
        run: |
          set -euo pipefail
          python3 -m py_compile security/oot2_nup_info.py security/oot2_gateway.py security/oot2_transfer.py security/oot2_sqlite_cas.py security/oot2_patch_nup_release.py security/run_oot2.py security/test_oot2_nup_info.py security/test_oot2_gateway.py security/test_oot2_transfer.py security/test_oot2_sqlite_cas.py security/test_oot2_patch_nup_release.py security/test_oot2_setup.py security/test_oot2_workflow.py security/test_oot2_memory_report.py
          bash -n security/setup_oot2.sh
          python3 -m unittest -v security/test_oot2_nup_info.py security/test_oot2_gateway.py security/test_oot2_transfer.py security/test_oot2_sqlite_cas.py security/test_oot2_patch_nup_release.py security/test_oot2_setup.py security/test_oot2_workflow.py security/test_oot2_memory_report.py
      - name: Verify NUP release and runtime patches against EXACT pinned nxnative source
        run: |
          set -euo pipefail
          UPSTREAM_SHA=c229bd7d52e30f072362e31c7b1e3206d107d4cd
          SMOKE="$RUNNER_TEMP/oot2-pinned-upstream-smoke"
          git init -q "$SMOKE"
          git -C "$SMOKE" remote add origin https://github.com/seedds/nxnative.git
          git -C "$SMOKE" fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C "$SMOKE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SMOKE" rev-parse HEAD)" = "$UPSTREAM_SHA"
          python3 security/oot2_runtime_smoke.py "$SMOKE"
          python3 security/oot2_patch_nup_release.py "$SMOKE/scripts/build_ipa_from_nsp.py"
          python3 -m py_compile "$SMOKE/scripts/build_ipa_from_nsp.py"
          python3 - "$SMOKE/scripts/build_ipa_from_nsp.py" <<'PY'
          from pathlib import Path
          import sys
          code = Path(sys.argv[1]).read_text()
          marker = '# OOT2_RUNNER_NUP_RELEASE_V1'
          assert code.count(marker) == 1
          assert code.index('aoc = extract_aoc(nx, keys, repo, work, app, fam, logs)') < code.index(marker)
          assert code.index(marker) < code.index('dlc_roms = sorted(')
          assert code.index('fam["nup"].close()') < code.index('candidate.unlink()')
          print("Pinned nxnative patch: anchor, syntax and release order verified (no game data)")
          PY
      - name: Scope
        run: echo "Synthetic metadata only; no Nintendo game, keys, Tailscale or native IPA build."

  macos-synthetic:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout exact changeset
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify APFS, NUP metadata and SSH interface
        run: |
          set -euo pipefail
          bash -n security/setup_oot2.sh
          python3 -m unittest -v security/test_oot2_nup_info.py security/test_oot2_gateway.py security/test_oot2_transfer.py security/test_oot2_sqlite_cas.py security/test_oot2_patch_nup_release.py security/test_oot2_setup.py security/test_oot2_workflow.py security/test_oot2_memory_report.py
      - name: Verify NUP release and runtime patches against EXACT pinned nxnative source
        run: |
          set -euo pipefail
          UPSTREAM_SHA=c229bd7d52e30f072362e31c7b1e3206d107d4cd
          SMOKE="$RUNNER_TEMP/oot2-pinned-upstream-smoke"
          git init -q "$SMOKE"
          git -C "$SMOKE" remote add origin https://github.com/seedds/nxnative.git
          git -C "$SMOKE" fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C "$SMOKE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SMOKE" rev-parse HEAD)" = "$UPSTREAM_SHA"
          python3 security/oot2_runtime_smoke.py "$SMOKE"
          python3 security/oot2_patch_nup_release.py "$SMOKE/scripts/build_ipa_from_nsp.py"
          python3 -m py_compile "$SMOKE/scripts/build_ipa_from_nsp.py"
          python3 - "$SMOKE/scripts/build_ipa_from_nsp.py" <<'PY'
          from pathlib import Path
          import sys
          code = Path(sys.argv[1]).read_text()
          marker = '# OOT2_RUNNER_NUP_RELEASE_V1'
          assert code.count(marker) == 1
          assert code.index('aoc = extract_aoc(nx, keys, repo, work, app, fam, logs)') < code.index(marker)
          assert code.index(marker) < code.index('dlc_roms = sorted(')
          assert code.index('fam["nup"].close()') < code.index('candidate.unlink()')
          print("Pinned nxnative patch: anchor, syntax and release order verified (no game data)")
          PY

  runtime-ios-compile:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: '0400486024DEC000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch exact upstream (no private data)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/oot2-compile"
          git -C "$RUNNER_TEMP/oot2-compile" remote add origin https://github.com/seedds/nxnative.git
          git -C "$RUNNER_TEMP/oot2-compile" fetch -q --depth 1 origin c229bd7d52e30f072362e31c7b1e3206d107d4cd
          git -C "$RUNNER_TEMP/oot2-compile" checkout -q --detach FETCH_HEAD
          python3 security/oot2_patch_runtime.py "$RUNNER_TEMP/oot2-compile" --variant memory-v1
      - name: Compile iOS sources only (no game shaders, no IPA, no signing)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          python3 "$RUNNER_TEMP/oot2-compile/dm/gfx/tools/own_compilers.py" --check-metal
          python3 "$RUNNER_TEMP/oot2-compile/dm/ios/tools/compile_check.py"
