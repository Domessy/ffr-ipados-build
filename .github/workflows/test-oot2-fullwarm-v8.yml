name: OOT2 full iOS prewarm validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-oot2-fullwarm-v8.yml'
      - 'security/oot2_fullwarm*'
      - 'security/test_oot2_fullwarm.py'

permissions:
  contents: read

jobs:
  ios-aot:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare exact public AOT tools - no guest or shader build
        run: |
          set -euo pipefail
          umask 077
          SRC="$RUNNER_TEMP/nxnative"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/seedds/nxnative.git
          git -C "$SRC" fetch -q --depth 1 origin ccd834e06a3938834bb5579e2ccc6a0ad13d3970
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          python3 security/oot2_fullwarm_prepare.py "$SRC"
          python3 security/oot2_fullwarm_refresh.py "$SRC"
          python3 -m unittest -v security.test_oot2_ipad_aot security.test_oot2_gateway security.test_oot2_transfer security.test_oot2_fullwarm
          python3 -m venv "$RUNNER_TEMP/aot-venv"
          "$RUNNER_TEMP/aot-venv/bin/python" -m pip install -q lz4
          "$RUNNER_TEMP/aot-venv/bin/python" "$SRC/dm/tools/tests/test_pso_offline.py"
      - name: Validate iOS render and compute archives plus incremental reuse
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          python3 "$RUNNER_TEMP/nxnative/dm/gfx/tools/own_compilers.py" --check-metal
          "$RUNNER_TEMP/aot-venv/bin/python" security/oot2_aot_pilot.py "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/public-aot-pilot"
      - name: Inspect public Metal pipeline script schema
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import subprocess,gzip,re
          from pathlib import Path
          tool=Path(subprocess.check_output(['xcrun','--find','metal-tt'],text=True).strip()).parent.parent
          pages=list(tool.rglob('metal4-pipelines-script.5*'))
          print('SCHEMA PAGES',*[str(x) for x in pages])
          assert pages, 'Metal4 script manual absent'
          raw=pages[0].read_bytes(); raw=gzip.decompress(raw) if pages[0].suffix=='.gz' else raw
          lines=raw.decode().splitlines(); found=set()
          for i,line in enumerate(lines):
              if re.search('write.mask|vertex.descriptor|mesh.render|ConstantInt|ConstantUInt|threadgroup|step.function',line,re.I):
                  found.update(range(max(0,i-2),min(len(lines),i+7)))
          for i in sorted(found): print(str(i)+': '+lines[i])
          PYCODE
      - name: Probe unified libraries and record unavailable GPU path
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -framework Metal -framework Foundation security/oot2_fullwarm_probe.m -o "$RUNNER_TEMP/fullwarm-probe"
          rc=0
          "$RUNNER_TEMP/fullwarm-probe" "$RUNNER_TEMP/public-aot-pilot/libraries/v.metallib" "$RUNNER_TEMP/public-aot-pilot/libraries/f.metallib" "$RUNNER_TEMP/fullwarm-probe.mtl4-json" || rc=$?
          [[ "$rc" == 0 || "$rc" == 4 ]]
          echo "Runtime compiler capability probe exit=$rc (4 means no Metal4 compiler; offline export must work without it)."
      - name: Export full native R/M descriptors without a runtime compiler
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/nxnative"
          python3 security/oot2_fullwarm.py build-exporter "$SRC"
          TOOL="$SRC/dm/gfx/tests/oot2_fullwarm_export"
          "$TOOL" --fixture-constants
          "$RUNNER_TEMP/aot-venv/bin/python" security/oot2_fullwarm_fixture.py "$RUNNER_TEMP/fullwarm-fixture" "$SRC" "$TOOL"
          python3 security/oot2_fullwarm.py export "$SRC" "$RUNNER_TEMP/fullwarm-fixture" "$RUNNER_TEMP/fullwarm-scripts"
          "$RUNNER_TEMP/aot-venv/bin/python" security/oot2_fullwarm.py compile "$SRC" "$RUNNER_TEMP/fullwarm-fixture/msl/b-d24f05cf9d78" "$RUNNER_TEMP/fullwarm-scripts" "$RUNNER_TEMP/fullwarm-cache" "$RUNNER_TEMP/fullwarm-bundle"
          python3 - "$RUNNER_TEMP/fullwarm-bundle" <<'PYCODE'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);m=json.loads((p/'fullwarm.json').read_text());c=m['coverage']
          assert c['render_rows']==5 and c['emitted_render']==3 and c['device_render_rows']==2 and c['mesh_rows']==2 and c['failed_tasks']==0
          print('Full native R/M export and iOS archive compilation passed:',c)
          PYCODE
          for a in "$RUNNER_TEMP/fullwarm-bundle/"*.mtl4a; do "$TOOL" --validate-archive "$a"; done
          find "$RUNNER_TEMP/fullwarm-cache" -name '*.mtl4a' -exec shasum -a 256 {} \; > "$RUNNER_TEMP/fullwarm-before.txt"
          "$RUNNER_TEMP/aot-venv/bin/python" security/oot2_fullwarm.py compile "$SRC" "$RUNNER_TEMP/fullwarm-fixture/msl/b-d24f05cf9d78" "$RUNNER_TEMP/fullwarm-scripts" "$RUNNER_TEMP/fullwarm-cache" "$RUNNER_TEMP/fullwarm-bundle"
          find "$RUNNER_TEMP/fullwarm-cache" -name '*.mtl4a' -exec shasum -a 256 {} \; > "$RUNNER_TEMP/fullwarm-after.txt"
          cmp "$RUNNER_TEMP/fullwarm-before.txt" "$RUNNER_TEMP/fullwarm-after.txt"

          python3 - "$RUNNER_TEMP/fullwarm-bundle/fullwarm.json" <<'PYCODE'
          import json,sys
          m=json.load(open(sys.argv[1]));assert m['reused_groups']==len(m['archives'])
          print('PASS: every full R/M group reused without recompilation.')
          PYCODE
      - name: Validate host backports without a GPU compiler
        run: |
          set -euo pipefail
          TESTS="$RUNNER_TEMP/nxnative/dm/gfx/tests"
          make -C "$TESTS" GAME=0400486024DEC000 -j 3 oot2_refresh_cpu t_pso_pending t_pso_depth_stencil t_pso_archive t_wait_event t_vc_ghost t_sparse_pool_cache > "$RUNNER_TEMP/refresh-tests-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/refresh-tests-build.log"; exit 1; }
          "$TESTS/oot2_refresh_cpu"
          "$TESTS/t_pso_pending"
          "$TESTS/t_pso_depth_stencil" --keys-only
          echo 'GPU fixtures compiled; runtime GPU tests require a Metal4-capable device and are not claimed passed.'
      - name: Validate production iOS loader link and host-kit reconstruction
        run: |
          set -euo pipefail
          brew install xcodegen zstd
          SRC="$RUNNER_TEMP/nxnative"
          GAME=0400486024DEC000 python3 "$SRC/dm/ios/tools/build_smoke.py" --output "$RUNNER_TEMP/fullwarm-link-fixture" > "$RUNNER_TEMP/fullwarm-link.log" 2>&1 || { tail -100 "$RUNNER_TEMP/fullwarm-link.log"; exit 1; }
          python3 security/oot2_fullwarm_host_fixture.py "$SRC" "$RUNNER_TEMP/fullwarm-link-fixture" "$RUNNER_TEMP/fullwarm-host-fixture" "$RUNNER_TEMP/public-aot-pilot/batch/applegpu_g17g.mtl4a" "$RUNNER_TEMP/fullwarm-bundle" > "$RUNNER_TEMP/fullwarm-host.log" 2>&1 || { tail -120 "$RUNNER_TEMP/fullwarm-host.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/fullwarm-link.log"
          tail -3 "$RUNNER_TEMP/fullwarm-host.log"
