name: OOT2 iPad-v5 optimization validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-oot2-upstream.yml'
      - '.github/workflows/build-oot2.yml'
      - 'security/oot2_prepare_ipad_v5.py'
      - 'security/oot2_ipad_v5_smoke.py'
      - 'security/oot2_telemetry.patch'
      - 'security/oot2_ipad_v5_defaults.env'
      - 'security/oot2_ipad_v5.patch'
      - 'security/oot2_ipad_v5_manifest.json'
      - 'security/run_oot2.py'

permissions:
  contents: read

jobs:
  upstream-public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch immutable public revision and verify preparation
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ipad-v5"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/seedds/nxnative.git
          git -C "$SRC" fetch -q --depth 1 origin 7f50222003e4270e3655d4f798e85744d390edf0
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          python3 security/oot2_ipad_v5_smoke.py "$SRC"
          python3 security/oot2_prepare_ipad_v5.py "$SRC"
          python3 -m venv "$RUNNER_TEMP/public-test-venv"
          "$RUNNER_TEMP/public-test-venv/bin/python" -m pip install -q lz4 'capstone>=5,<6'
          for test in test_nsp_nup test_pso_offline test_shader_rewrites test_shader_cache test_shader_toolchain_cache test_patches test_nsp_chain test_oot_frame_step; do
            "$RUNNER_TEMP/public-test-venv/bin/python" "$SRC/dm/tools/tests/$test.py"
          done
          python3 "$SRC/dm/gfx/tests/test_dmsh_meshstage.py"
          for test in test_dmsh_hmma test_dmsh_gather_offsets test_dmsh_redsum test_dmsh_zsnap test_dmsh_extended_multiply; do
            python3 "$SRC/dm/gfx/tests/$test.py"
          done

  upstream-ios-compile:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME: '0400486024DEC000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare exact candidate without private inputs
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ipad-v5"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/seedds/nxnative.git
          git -C "$SRC" fetch -q --depth 1 origin 7f50222003e4270e3655d4f798e85744d390edf0
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          python3 security/oot2_prepare_ipad_v5.py "$SRC"
      - name: Compile iOS and focused regression binaries (no IPA)
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ipad-v5"
          xcodebuild -downloadComponent MetalToolchain
          python3 "$SRC/dm/gfx/tools/own_compilers.py" --check-metal
          python3 "$SRC/dm/ios/tools/compile_check.py"
          python3 "$SRC/dm/gfx/tests/test_dmsh_meshstage.py"
          for test in test_dmsh_hmma test_dmsh_gather_offsets test_dmsh_redsum test_dmsh_zsnap test_dmsh_extended_multiply; do
            python3 "$SRC/dm/gfx/tests/$test.py"
          done
          python3 "$SRC/dm/tools/tests/test_oot_frame_step.py"
          make -C "$SRC/dm/gfx/tests" -j2 t_wait_event t_queue_lifetime t_render_enable_queue t_render_counter_overlap t_mesh_first_use t_omap_mask t_cpu_storage t_cpu_tex t_capture t_rt_recycle t_dispatch_own t_zsnap t_fstep
          make -C "$SRC/dm/gfx/tests" check_t_capture
          "$SRC/dm/gfx/tests/t_cpu_tex"
          "$SRC/dm/gfx/tests/t_fstep"
          cat > "$RUNNER_TEMP/probe-metal4.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          int main(void) { @autoreleasepool {
              id<MTLDevice> d = MTLCreateSystemDefaultDevice();
              printf("Metal GPU: %s\n", d.name.UTF8String ?: "none");
              return d && [d supportsFamily:MTLGPUFamilyMetal4] ? 0 : 77;
          } }
          OBJC
          xcrun clang -fobjc-arc "$RUNNER_TEMP/probe-metal4.m" -framework Metal -framework Foundation -o "$RUNNER_TEMP/probe-metal4"
          rc=0
          "$RUNNER_TEMP/probe-metal4" || rc=$?
          if [ "$rc" -eq 0 ]; then
            make -C "$SRC/dm/gfx/tests" check_t_wait_event check_t_queue_lifetime check_t_render_enable_queue check_t_render_counter_overlap check_t_mesh_first_use check_t_omap_mask check_t_cpu_storage check_t_cpu_tex check_t_rt_recycle check_t_dispatch_own
            DM_NVN_SEG_POST=1 DM_NVN_SEG_RB=1 make -C "$SRC/dm/gfx/tests" check_t_render_counter_overlap check_t_queue_lifetime
            make -C "$SRC/dm/gfx/tests" check_t_zsnap
          elif [ "$rc" -eq 77 ]; then
            echo '::notice::Metal 4 GPU execution NOT validated on this runner. iOS sources and focused binaries compiled; device validation remains required.'
          else
            exit "$rc"
          fi
