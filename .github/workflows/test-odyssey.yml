name: Super Mario Odyssey nxnative - synthetic security tests

on:
  push:
    branches:
      - feature/super-mario-odyssey-nxnative
      - fix/odyssey-xcode-27-2
    paths:
      - '.github/workflows/build-odyssey.yml'
      - '.github/workflows/test-odyssey.yml'
      - 'security/ffr_ssh_gate.py'
      - 'security/odyssey_*.py'
      - 'security/test_odyssey_*.py'
      - 'security/run_odyssey.py'
      - 'security/cache_export.py'
      - 'security/setup_odyssey.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ody-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python syntax and unit tests (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            security/ffr_ssh_gate.py security/odyssey_gateway.py \
            security/odyssey_transfer.py security/run_odyssey.py \
            security/cache_export.py security/test_cache_import.py \
            security/test_odyssey_gateway.py security/test_odyssey_transfer.py
          bash -n security/setup_odyssey.sh
          python3 -m unittest -v \
            security/test_cache_import.py \
            security/test_odyssey_gateway.py \
            security/test_odyssey_transfer.py
      - name: Verify compiler selection stays pinned to upstream Metal 32023.922
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/build-odyssey.yml").read_text()
          assert "/Applications/Xcode_27.2.app" in workflow
          assert "/Applications/Xcode_27.2_Release_Candidate.app" in workflow
          assert "Apple metal version 32023.922 (metalfe-32023.922.4)" in workflow
          assert "own_compilers.py" in workflow and "--check-metal" in workflow
          assert "Xcode 27.1" not in workflow
          assert "DM_ALLOW_OTHER_METAL" not in workflow
          print("Odyssey build targets Xcode 27.2 and strictly validated Metal 32023.922.")
          PY
      - name: Confirm this run performed only synthetic checks
        run: echo 'No SSH connection, private keys, NSP or game data used.'
