name: OOT2 v10 official public Mac and iOS gates
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  public:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Recuperer les scripts de cache du meme commit GitHub
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Select exact Metal toolchain
      shell: bash
      run: |
        set -euo pipefail
        sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
        xcodebuild -downloadComponent MetalToolchain
    - name: Verifier les scripts et tests NUP avant tout transfert prive
      run: |
        set -euo pipefail
        python3 -m unittest discover -s security -p 'test_oot2*.py' -q
    - name: Validate complete official v10 source before private transfers
      run: |
        set -euo pipefail
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install xcodegen zstd spirv-cross glslang python@3.15
        "$(brew --prefix python@3.15)/bin/python3.15" -m venv "$RUNNER_TEMP/oot2-venv"
        "$RUNNER_TEMP/oot2-venv/bin/python" -m pip install -q lz4 'capstone>=5,<6' fonttools nsz zbic
        SRC="$RUNNER_TEMP/nxnative"
        git init -q "$SRC"
        git -C "$SRC" remote add origin https://github.com/seedds/nxnative.git
        git -C "$SRC" fetch -q --depth 1 origin e4b0d9b75d39c41c10fdcfec2f0b070df496d7e5
        git -C "$SRC" checkout -q --detach FETCH_HEAD
        python3 security/oot2_prepare_ipad_v10.py "$SRC"
        "$RUNNER_TEMP/oot2-venv/bin/python" security/oot2_v10_public.py "$SRC" "$RUNNER_TEMP/public-v10" > "$RUNNER_TEMP/public-v10.log" 2>&1 || { tail -140 "$RUNNER_TEMP/public-v10.log"; exit 1; }
        tail -15 "$RUNNER_TEMP/public-v10.log"
