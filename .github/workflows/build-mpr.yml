name: Metroid Prime Remastered - native iPadOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight or build title 010012101468C000 v0 with isolated checkpoints
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - keys-check
          - build

permissions:
  contents: read

concurrency:
  group: mpr-build
  cancel-in-progress: false

jobs:
  build:
    # Explicitly enabled only by security/harden-cachyos.sh on the user's PC.
    if: vars.FFR_SECURITY_READY == 'true'
    # Apple Silicon standard, public repositories: GitHub Xcode 27 image.
    runs-on: xcode-27
    # GitHub-hosted jobs may run up to 360 min. Keep a margin for private log upload and cleanup.
    timeout-minutes: 345
    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer les scripts de cache du meme commit GitHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verifier les scripts avant tout transfert prive
        run: |
          set -euo pipefail
          python3 -m py_compile security/ffr_ssh_gate.py security/mpr_gateway.py security/mpr_transfer.py security/cache_export.py security/run_mpr.py security/test_cache_import.py security/test_mpr_gateway.py security/test_mpr_transfer.py
          python3 -m unittest -v security/test_cache_import.py security/test_mpr_gateway.py security/test_mpr_transfer.py

      - name: Preparer Xcode 27.1 et liberer de l'espace
        run: |
          set -euo pipefail
          echo 'Espace initial :'
          df -h "$RUNNER_TEMP"
          # nxnative/dmsh_chain.lock requires the Xcode 27.1 Metal compiler.
          KEEP=/Applications/Xcode_27.1.app
          if [ ! -d "$KEEP/Contents/Developer" ]; then
            echo 'Xcode 27.1 indisponible sur cette image GitHub.' >&2
            exit 1
          fi
          echo "Xcode conserve : $KEEP"
          sudo xcode-select -s "$KEEP/Contents/Developer"
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            [ "$app" = "$KEEP" ] && continue
            [ -L "$app" ] && continue
            echo "Suppression sur runner ephemere : $app"
            sudo rm -rf -- "$app"
          done
          xcodebuild -version
          # Since Xcode 26, the Metal toolchain is an optional component.
          if ! xcodebuild -showComponent metalToolchain 2>/dev/null | grep -qi 'Status: installed'; then
            echo 'Installation du Metal Toolchain correspondant a Xcode 27.1.'
            xcodebuild -downloadComponent metalToolchain
          fi
          echo 'Compilateurs Metal selectionnes :'
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version

          # xcodebuild uses the iOS DEVICE SDK, not an Android SDK or
          # simulator runtime. All cleanup is confined to this ephemeral runner,
          # never to CachyOS or any developer workstation.
          echo 'Liberation espace temporaire pour MPR.'
          if [ "$HOME" = "/Users/runner" ]; then
            for sdk in "$HOME/Library/Android/sdk" "$HOME/Library/Android/Sdk"; do
              if [ -d "$sdk" ] && [ ! -L "$sdk" ]; then
                du -sh "$sdk" || true
                sudo rm -rf -- "$sdk"
              fi
            done
          fi
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 55000000 ]; then
            echo 'Espace encore limite: nettoyage des runtimes de simulateurs GitHub inutilises.'
            xcrun simctl runtime list || true
            # On Xcode 27 this supported simctl operation removes simulator
            # runtime disk images, not the iOS device SDK or Metal compiler.
            # Bound its runtime to avoid hanging a hosted job indefinitely.
            python3 - <<'PY'
          import subprocess
          try:
              p = subprocess.run(
                  ["xcrun", "simctl", "runtime", "delete", "all"],
                  capture_output=True, text=True, timeout=240, check=False)
              print(f"Simulator runtime cleanup exit code: {p.returncode}")
              if p.returncode:
                  print("Simulator runtime cleanup unavailable; continuing to disk preflight.")
          except (OSError, subprocess.TimeoutExpired):
              print("Simulator runtime cleanup timed out/unavailable; continuing to disk preflight.")
          PY
            xcrun simctl delete unavailable || true
          fi
          df -h "$RUNNER_TEMP"
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          # Sufficient space for v0 game data, extracted RomFS, shader CAS and IPA.
          if [ "$free_kb" -lt 42000000 ]; then
            echo 'MPR runner disk below initial 42 GB admission guard.' >&2
            exit 1
          fi

      - name: Installer les dependances nxnative
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          # Homebrew passe par ghcr.io : attendre si le DNS est temporairement indisponible.
          for attempt in 1 2 3 4; do
            echo "Installation Homebrew, tentative ${attempt}/4"
            if brew install xcodegen zstd spirv-cross glslang; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Installation Homebrew impossible apres 4 tentatives." >&2
              exit 1
            fi
            echo "Echec transitoire, nouvel essai dans 20 secondes."
            sleep 20
          done
          dotnet --version
          python3 -m venv "$RUNNER_TEMP/mpr-venv"
          "$RUNNER_TEMP/mpr-venv/bin/python" -m pip install -q lz4 capstone fonttools
          # Pin the upstream code that will process local Nintendo key material.
          NXNATIVE_SHA="2716f78f01e90a9f9bbf0d09e7a798903525962f"
          git init -q "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" remote add origin https://github.com/seedds/nxnative.git
          git -C "$RUNNER_TEMP/nxnative" fetch -q --depth 1 origin "$NXNATIVE_SHA"
          git -C "$RUNNER_TEMP/nxnative" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nxnative" rev-parse HEAD)" = "$NXNATIVE_SHA"
          # Verify the compiler before transferring any private game data.
          # reject Metal versions incompatible with the pinned nxnative shader chain.
          "$RUNNER_TEMP/mpr-venv/bin/python" "$RUNNER_TEMP/nxnative/dm/gfx/tools/own_compilers.py" --check-metal
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          if [ "$free_kb" -lt 52000000 ]; then
            echo "Espace restant insuffisant apres installation ($free_kb Ko, objectif 52000000 Ko)." >&2
            exit 1
          fi

      - name: Installer Tailscale en ligne de commande (sans action DNS)
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for attempt in 1 2 3; do
            if brew install --formula tailscale; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          command -v tailscale
          command -v tailscaled

      - name: Connecter Tailscale sans modifier les DNS macOS
        env:
          TS_AUTHKEY: ${{ secrets.FFR_TS_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TS_AUTHKEY"
          TS_CLI="$(command -v tailscale)"
          TS_DAEMON="$(command -v tailscaled)"
          TS_SOCKET="$RUNNER_TEMP/mpr-tailscaled.sock"
          # Temporary daemon with in-memory state; no persistent login data.
          nohup sudo -n "$TS_DAEMON" --state=mem: --socket="$TS_SOCKET" \
            > "$RUNNER_TEMP/mpr-tailscaled.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/mpr-tailscaled.pid"
          daemon_ready=0
          for attempt in $(seq 1 30); do
            if sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json > /dev/null 2>&1; then
              daemon_ready=1
              break
            fi
            sleep 1
          done
          if [ "$daemon_ready" -ne 1 ]; then
            echo 'Tailscale daemon did not become ready.' >&2
            exit 1
          fi
          # No MagicDNS required: the host is reached by its Tailscale IPv4 address.
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" up \
            --authkey="$TS_AUTHKEY" \
            --accept-dns=false \
            --timeout=120s \
            --hostname="mpr-ci-${GITHUB_RUN_ID}"
          sudo -n "$TS_CLI" --socket="$TS_SOCKET" status --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("BackendState") == "Running"; print("Tailscale running; macOS system DNS unchanged.")'

      - name: Configurer SSH avec cle d'hote epinglee
        env:
          SSH_KEY: ${{ secrets.FFR_SSH_KEY }}
          HOSTKEY: ${{ secrets.FFR_SSH_KNOWN_HOSTS }}
          PC_IP: ${{ secrets.FFR_TS_HOST }}
          PC_USER: ${{ secrets.FFR_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/mpr_ssh_key"
          printf '%s\n' "$HOSTKEY" > "$RUNNER_TEMP/mpr_known_hosts"
          chmod 600 "$RUNNER_TEMP/mpr_ssh_key" "$RUNNER_TEMP/mpr_known_hosts"
          {
            echo 'Host ffr-cachyos'
            printf '  HostName %s\n' "$PC_IP"
            printf '  User %s\n' "$PC_USER"
            echo '  Port 22'
            printf '  IdentityFile %s\n' "$RUNNER_TEMP/mpr_ssh_key"
            printf '  UserKnownHostsFile %s\n' "$RUNNER_TEMP/mpr_known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          # Require the local path-scoped MPR gateway, before any private data.
          # Key-only checks must not depend on the local game directory:
          # a failed MPR source probe previously prevented key diagnosis.
          if [ "${{ inputs.mode }}" = "keys-check" ]; then
            [ "$(ssh -o ConnectTimeout=15 ffr-cachyos probe)" = 'FFR_GATEWAY_OK' ]
          else
            # Safe fixed-code diagnostics, intentionally no paths or key data.
            ssh -o ConnectTimeout=15 ffr-cachyos mpr-diagnose-v1
            [ "$(ssh -o ConnectTimeout=15 ffr-cachyos mpr-probe-v1)" = 'MPR_GATEWAY_V1' ]
          fi

      - name: Verifier le jeu MPR v0 et le budget disque sans transfert
        run: |
          set -euo pipefail
          read -r TITLE VERSION B UPDATES <<< "$(ssh ffr-cachyos mpr-manifest-v1)"
          [[ "$TITLE" == "010012101468C000" && "$VERSION" == "0" ]]
          [[ "$B" =~ ^[1-9][0-9]*$ && "$UPDATES" =~ ^[0-9]+$ ]]
          free=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          required=$(( 2 * B + 20 * 1024**3 ))
          if (( required < 34 * 1024**3 )); then required=$(( 34 * 1024**3 )); fi
          echo "MPR title=$TITLE; base_version=$VERSION; base_bytes=$B; optional_update_files=$UPDATES"
          echo "MPR free_bytes=$free; admission_bytes=$required"
          if (( free < required )); then
            echo 'MPR storage guard: refusing transfer before capacity is sufficient.' >&2
            exit 1
          fi
          if (( UPDATES > 0 )); then
            echo 'MPR: update NSPs exist locally; v0 profile selected, updates not transferred.' 
          fi
          echo 'MPR preflight passed: known v0 profile and private gateway verified.'

      - name: Restaurer les shaders Metroid Prime depuis CachyOS
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          export DMSH_CAS="$RUNNER_TEMP/mpr-shader-cas"
          umask 077
          mkdir -p "$DMSH_CAS"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 ffr-cachyos mpr-read-cache \
            | tar -xz -C "$DMSH_CAS"
          echo "MPR shader CAS restored; files=$(find "$DMSH_CAS" -type f | wc -l | tr -d ' ')"
          du -sh "$DMSH_CAS"
          read -r TITLE VERSION B UPDATES <<< "$(ssh ffr-cachyos mpr-manifest-v1)"
          free=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          reserve=$(( B + 20 * 1024**3 ))
          if (( free < reserve )); then
            echo 'MPR shader cache consumed disk reserve: no game file transferred.' >&2
            exit 1
          fi

      - name: Recuperer et verifier les cles privees AVANT le NSP
        if: ${{ inputs.mode == 'build' || inputs.mode == 'keys-check' }}
        run: |
          set -euo pipefail
          umask 077
          # Existing shared read-only route, used by the other verified game pipelines.
          # Never print the file contents or its filesystem path in CI logs.
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            ffr-cachyos read-keys > "$RUNNER_TEMP/mpr-prod.keys"
          chmod 600 "$RUNNER_TEMP/mpr-prod.keys"
          test -s "$RUNNER_TEMP/mpr-prod.keys"
          # Only sanity-check the key-file structure, without disclosing values.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "mpr-prod.keys"
          lines = p.read_bytes().splitlines()
          if len(lines) < 4 or not any(
              line.strip().startswith(b"header_key =") or line.strip().startswith(b"header_key=")
              for line in lines
          ):
              raise SystemExit("MPR private key file is missing expected header_key")
          print("MPR private keys: received and structurally verified before source transfer.")
          PY
          if [ "${{ inputs.mode }}" = "keys-check" ]; then
            echo 'MPR keys-check passed; the game NSP was not transferred.'
          fi

      - name: Transferer le seul NSP de base MPR 1.0.0
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mpr-nsp"
          read -r TITLE VERSION B UPDATES <<< "$(ssh ffr-cachyos mpr-manifest-v1)"
          [[ "$TITLE" == "010012101468C000" && "$VERSION" == 0 ]]
          python3 security/mpr_transfer.py base "$B" "$RUNNER_TEMP/mpr-nsp/Metroid Prime Remastered [010012101468C000][v0].nsp"
          test -s "$RUNNER_TEMP/mpr-prod.keys"
          echo 'MPR source transfer complete; original remains on CachyOS.'

      - name: Compiler IPA MPR et checkpoint shaders regulierement
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          python3 security/run_mpr.py

      - name: Rapatrier IPA MPR sur CachyOS
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/MetroidPrimeRemastered-iPadOS.ipa"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            ffr-cachyos mpr-write-ipa < "$RUNNER_TEMP/MetroidPrimeRemastered-iPadOS.ipa"
          shasum -a 256 "$RUNNER_TEMP/MetroidPrimeRemastered-iPadOS.ipa"
          echo 'MPR IPA transferred privately; no public artifact.'

      - name: Retourner le log prive apres succes ou echec
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/mpr-build.log" ]; then
            tail -c 16777216 "$RUNNER_TEMP/mpr-build.log" \
              | ssh -o ConnectTimeout=20 ffr-cachyos mpr-write-log || true
          fi
          rm -f "$RUNNER_TEMP/mpr-prod.keys" "$RUNNER_TEMP/mpr_ssh_key" || true

      - name: Fermer la connexion Tailscale ephemere
        if: always()
        run: |
          TS_SOCKET="$RUNNER_TEMP/mpr-tailscaled.sock"
          if command -v tailscale >/dev/null 2>&1; then
            sudo -n tailscale --socket="$TS_SOCKET" logout > /dev/null 2>&1 || true
          fi
          if [ -s "$RUNNER_TEMP/mpr-tailscaled.pid" ]; then
            sudo -n kill "$(cat "$RUNNER_TEMP/mpr-tailscaled.pid")" > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/mpr-prod.keys" "$RUNNER_TEMP/mpr_ssh_key" || true
